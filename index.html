<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B23;
  --ink-soft:#4A5A50;
  --ink-faint:#8B9A90;
  --paper:#E9EBE3;
  --card:#F8F9F4;
  --line:#B9C2B6;
  --brass:#9A7B3F;
  --rose:#A2635C;
  --blue:#5A7286;
  --shadow:rgba(30,43,35,.13);
  --serif:"Spectral",Georgia,"Iowan Old Style",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --node-w:168px;
  --node-h:76px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:14px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- top bar ---------- */
.bar{
  position:fixed;inset:0 0 auto 0;height:52px;z-index:30;
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:rgba(233,235,227,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.mark{
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.01em;
  margin-right:4px;white-space:nowrap;
}
.mark span{color:var(--brass)}
.treename{
  font-family:var(--serif);font-size:14px;background:transparent;border:1px solid transparent;
  border-radius:3px;padding:4px 7px;min-width:60px;max-width:190px;
}
.treename:hover{border-color:var(--line)}
.treename:focus{outline:none;border-color:var(--brass);background:var(--card)}
.spacer{flex:1}
.btn{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:6px 11px;font-size:12.5px;color:var(--ink-soft);
  transition:border-color .12s,color .12s;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#2B3C32}
.btn.danger{color:var(--rose);border-color:#D6C0BD}
.btn.danger:hover{background:var(--rose);border-color:var(--rose);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.search{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:6px 9px;font-size:12.5px;width:150px;
}
.search:focus{outline:none;border-color:var(--brass)}
.zoomgrp{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--card)}
.zoomgrp button{background:none;border:none;padding:6px 10px;font-size:13px;color:var(--ink-soft)}
.zoomgrp button:hover{background:#E3E6DC;color:var(--ink)}
.zoomgrp button+button{border-left:1px solid var(--line)}

/* ---------- canvas ---------- */
#stage{
  position:fixed;inset:52px 0 0 0;overflow:hidden;cursor:grab;
  background-image:radial-gradient(circle, #D2D8CD 1px, transparent 1px);
  background-size:22px 22px;
}
#stage.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
#links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

.node{
  position:absolute;width:var(--node-w);height:var(--node-h);
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  box-shadow:0 1px 2px var(--shadow);
  padding:9px 11px 9px 13px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;
  transition:box-shadow .12s,border-color .12s,transform .12s;
}
.node::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink-faint);
}
.node.f::before{background:var(--rose)}
.node.m::before{background:var(--blue)}
.node.o::before{background:var(--brass)}
.node:hover{border-color:var(--ink-soft);box-shadow:0 3px 9px var(--shadow);transform:translateY(-1px)}
.node.sel{border-color:var(--brass);box-shadow:0 0 0 2px rgba(154,123,63,.3),0 3px 9px var(--shadow)}
.node.hit{background:#FBF4E2;border-color:var(--brass)}
.n-name{
  font-family:var(--serif);font-size:14.5px;font-weight:500;line-height:1.22;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.n-rule{height:1px;background:var(--line);margin:6px 0 5px;width:26px}
.n-dates{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em}

.genrail{
  position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--ink-faint);text-transform:uppercase;white-space:nowrap;
  writing-mode:vertical-rl;
}

/* ---------- record panel ---------- */
#panel{
  position:fixed;top:52px;right:0;bottom:0;width:340px;z-index:25;
  background:var(--card);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
#panel.open{transform:none}
.p-head{
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:10px;
}
.p-head h2{
  font-family:var(--serif);font-size:19px;font-weight:600;margin:0;line-height:1.2;flex:1;
  word-break:break-word;
}
.x{background:none;border:none;font-size:19px;line-height:1;color:var(--ink-faint);padding:0 2px}
.x:hover{color:var(--ink)}
.p-body{flex:1;overflow-y:auto;padding:16px 18px 40px}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brass);margin:22px 0 9px;display:flex;align-items:center;gap:8px;
}
.eyebrow:first-child{margin-top:0}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:11px;color:var(--ink-faint);margin:0 0 3px;letter-spacing:.02em}
.f{margin-bottom:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--line);border-radius:3px;
  padding:7px 9px;font-size:13px;
}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);background:#fff}
textarea{resize:vertical;min-height:66px;font-family:var(--sans);line-height:1.5}
.hint{font-size:11px;color:var(--ink-faint);margin-top:4px;line-height:1.4}

.chips{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.chip{
  display:flex;align-items:center;gap:6px;background:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:5px 6px 5px 9px;font-size:12.5px;
}
.chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip span:hover{text-decoration:underline}
.chip button{background:none;border:none;color:var(--ink-faint);font-size:15px;line-height:1;padding:0 3px}
.chip button:hover{color:var(--rose)}
.none{font-size:12px;color:var(--ink-faint);font-style:italic;margin-bottom:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:5px 9px;font-size:12px}

/* ---------- empty state ---------- */
#empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;
}
#empty h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
#empty p{color:var(--ink-soft);max-width:380px;margin:0 0 22px;line-height:1.6}
#empty .rule{width:44px;height:1px;background:var(--brass);margin:0 0 20px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:3px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 4px 14px rgba(30,43,35,.28);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

#status{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.06em}

@media (max-width:760px){
  #panel{width:100%;top:52px}
  .search,.treename{display:none}
  .mark{font-size:15px}
  .btn{padding:6px 9px}
}
@media print{
  .bar,#panel,#toast,.zoomgrp{display:none!important}
  #stage{position:static;inset:auto;overflow:visible;background:none}
  body{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="mark">Family<span>&nbsp;Register</span></div>
  <input id="treename" class="treename" value="Untitled tree" aria-label="Tree name">
  <div class="spacer"></div>
  <span id="status"></span>
  <input id="search" class="search" placeholder="Find a name" aria-label="Find a name">
  <div class="zoomgrp">
    <button id="zout" title="Zoom out">&minus;</button>
    <button id="zfit" title="Fit to screen">Fit</button>
    <button id="zin" title="Zoom in">+</button>
  </div>
  <button class="btn" id="addBtn">Add person</button>
  <button class="btn" id="saveBtn">Save file</button>
  <button class="btn" id="openBtn">Open file</button>
  <button class="btn" id="printBtn">Print</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>

<div id="stage">
  <div id="world">
    <svg id="links"></svg>
  </div>
  <div id="empty">
    <div class="rule"></div>
    <h1>Start with one person</h1>
    <p>Add yourself first, then build outward — parents above, partners beside, children below. Everything saves in this browser, and you can download the whole tree as a file whenever you like.</p>
    <button class="btn primary" id="startBtn">Add the first person</button>
  </div>
</div>

<aside id="panel" aria-label="Person record">
  <div class="p-head">
    <h2 id="pTitle">Record</h2>
    <button class="x" id="pClose" aria-label="Close record">&times;</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<div id="toast"></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var NODE_W=168, NODE_H=76, H_GAP=28, V_GAP=92, ROOT_GAP=70, PAD=90;
var KEY="familyRegister.v1";
/* Paste a saved tree here to bake it into the page for every visitor. */
var SEED=null;
var ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];

/* ============ state ============ */
var data={name:"Untitled tree",people:[]};
var byId={};
var selected=null;
var view={x:0,y:0,k:1};
var pos={}, canSave=true, query="";

var stage=document.getElementById("stage"),
    world=document.getElementById("world"),
    svg=document.getElementById("links"),
    panel=document.getElementById("panel"),
    pBody=document.getElementById("pBody"),
    pTitle=document.getElementById("pTitle"),
    emptyEl=document.getElementById("empty"),
    statusEl=document.getElementById("status");

/* ============ helpers ============ */
function uid(){return "p"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function index(){byId={};data.people.forEach(function(p){byId[p.id]=p;});}
function label(p){return (p&&p.name&&p.name.trim())?p.name.trim():"Unnamed";}
function lifespan(p){
  var b=(p.birth||"").trim(), d=(p.death||"").trim();
  if(!b&&!d) return "";
  return (b||"?")+" – "+(d||(p.deceased?"?":""));
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},2200);
}

/* ============ persistence ============ */
function save(){
  if(!canSave) return;
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    statusEl.textContent="SAVED";
  }catch(e){
    canSave=false;
    statusEl.textContent="PREVIEW — USE SAVE FILE";
  }
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&Array.isArray(d.people)) data=normalize(d);
    }else if(SEED){ data=normalize(SEED); }
    statusEl.textContent="SAVED";
  }catch(e){
    canSave=false;
    statusEl.textContent="PREVIEW — USE SAVE FILE";
    if(SEED) data=normalize(SEED);
  }
}
function normalize(d){
  var out={name:d.name||"Untitled tree",people:[]};
  (d.people||[]).forEach(function(p){
    out.people.push({
      id:p.id||uid(), name:p.name||"", sex:p.sex||"",
      birth:p.birth||"", death:p.death||"", place:p.place||"",
      notes:p.notes||"",
      parents:Array.isArray(p.parents)?p.parents.slice(0,2):[],
      partners:Array.isArray(p.partners)?p.partners.slice():[]
    });
  });
  var ids={};out.people.forEach(function(p){ids[p.id]=1;});
  out.people.forEach(function(p){
    p.parents=p.parents.filter(function(i){return ids[i]&&i!==p.id;});
    p.partners=p.partners.filter(function(i){return ids[i]&&i!==p.id;});
  });
  return out;
}
function commit(){index();save();render();}

/* ============ unions ============ */
function buildUnions(){
  var map={}, order=[];
  function get(ids){
    var k=ids.slice().sort().join("+");
    if(!map[k]){map[k]={key:k,partners:ids.slice(),children:[]};order.push(map[k]);}
    return map[k];
  }
  data.people.forEach(function(p){
    (p.partners||[]).forEach(function(q){ if(byId[q]) get([p.id,q]); });
  });
  data.people.forEach(function(c){
    var ps=(c.parents||[]).filter(function(i){return byId[i];});
    if(ps.length) get(ps).children.push(c.id);
  });
  return {map:map,list:order};
}
function unionsOf(id,list){
  return list.filter(function(u){return u.partners.indexOf(id)>-1;});
}

/* ============ layout ============ */
function layout(){
  var U=buildUnions(), list=U.list;
  pos={};
  var done={}, unionDone={}, placedOrder=[];

  function subtree(id,depth,x){
    done[id]=1;
    var mine=unionsOf(id,list).filter(function(u){return !unionDone[u.key];});
    mine.forEach(function(u){unionDone[u.key]=1;});

    // seat partners on alternating sides so remarriages don't draw across a card
    var leftE=[], rightE=[];
    mine.forEach(function(u,i){
      var other=null;
      u.partners.forEach(function(pid){ if(pid!==id) other=pid; });
      var take=!!(other&&!done[other]);
      if(take) done[other]=1;
      var entry={u:u,pid:take?other:null};
      if(i%2===1&&take) leftE.unshift(entry); else rightE.push(entry);
    });
    var rowEntries=leftE.concat([{u:null,pid:id}],rightE.filter(function(e){return e.pid;}));
    var rowIds=rowEntries.map(function(e){return e.pid;});
    var personIdx=rowIds.indexOf(id);
    var uOrder=mine.map(function(u){
      var idx=-1;
      rowEntries.forEach(function(e,i){ if(e.u===u&&e.pid) idx=i; });
      if(idx<0) idx=personIdx;
      return {u:u,k:(idx+personIdx)/2};
    }).sort(function(a,b){return a.k-b.k;}).map(function(e){return e.u;});

    var snap=placedOrder.length, cursor=x;
    uOrder.forEach(function(u){
      u.children.forEach(function(kid){
        if(done[kid]) return;
        var w=subtree(kid,depth+1,cursor);
        cursor+=w+H_GAP;
      });
    });
    var childW=Math.max(0,cursor-x-H_GAP);
    var rowW=rowIds.length*NODE_W+(rowIds.length-1)*H_GAP;
    var total=Math.max(rowW,childW);

    if(rowW>childW&&childW>0){
      var dx=(rowW-childW)/2;
      for(var i=snap;i<placedOrder.length;i++) pos[placedOrder[i]].x+=dx;
    }
    var rx=x+(total-rowW)/2;
    rowIds.forEach(function(rid,i){
      pos[rid]={x:rx+i*(NODE_W+H_GAP),y:depth*(NODE_H+V_GAP),depth:depth};
      placedOrder.push(rid);
    });
    return total;
  }

  var cursor=0;
  data.people.forEach(function(p){
    var hasParent=(p.parents||[]).some(function(i){return byId[i];});
    if(hasParent||done[p.id]) return;
    cursor+=subtree(p.id,0,cursor)+ROOT_GAP;
  });
  data.people.forEach(function(p){
    if(done[p.id]) return;
    cursor+=subtree(p.id,0,cursor)+ROOT_GAP;
  });
  return U;
}

/* ============ render ============ */
function render(){
  var U=layout();
  emptyEl.style.display=data.people.length?"none":"flex";

  // bounds
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,depths={};
  data.people.forEach(function(p){
    var q=pos[p.id]; if(!q) return;
    minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x+NODE_W);
    minY=Math.min(minY,q.y);maxY=Math.max(maxY,q.y+NODE_H);
    depths[q.depth]=1;
  });
  if(minX>maxX){minX=0;maxX=0;minY=0;maxY=0;}
  var ox=PAD-minX, oy=PAD-minY;
  var W=(maxX-minX)+PAD*2, H=(maxY-minY)+PAD*2;

  world.style.width=W+"px";world.style.height=H+"px";
  svg.setAttribute("width",W);svg.setAttribute("height",H);
  svg.setAttribute("viewBox","0 0 "+W+" "+H);

  // clear nodes
  Array.prototype.slice.call(world.querySelectorAll(".node,.genrail")).forEach(function(n){n.remove();});

  // generation rail
  Object.keys(depths).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
    var el=document.createElement("div");
    el.className="genrail";
    el.textContent="Gen "+(ROMAN[d]||(d+1));
    el.style.left="18px";
    el.style.top=(d*(NODE_H+V_GAP)+oy)+"px";
    el.style.height=NODE_H+"px";
    world.appendChild(el);
  });

  // links
  var parts=[];
  function line(x1,y1,x2,y2){
    parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
      '" stroke="var(--line)" stroke-width="1.25" stroke-linecap="round"/>');
  }
  U.list.forEach(function(u){
    var placedP=u.partners.filter(function(i){return pos[i];});
    if(!placedP.length) return;
    var ux,uy;
    if(placedP.length===2){
      var a=pos[placedP[0]],b=pos[placedP[1]];
      var l=a.x<=b.x?a:b, r=a.x<=b.x?b:a;
      if(a.y===b.y){
        var y=a.y+NODE_H/2+oy;
        line(l.x+NODE_W+ox,y,r.x+ox,y);
        ux=((l.x+NODE_W)+r.x)/2+ox; uy=y;
      }else{
        line(l.x+NODE_W/2+ox,l.y+NODE_H+oy,r.x+NODE_W/2+ox,r.y+oy);
        ux=(l.x+r.x)/2+NODE_W/2+ox; uy=Math.max(l.y,r.y)+oy;
      }
      parts.push('<circle cx="'+ux+'" cy="'+uy+'" r="2.6" fill="var(--brass)"/>');
    }else{
      var s=pos[placedP[0]];
      ux=s.x+NODE_W/2+ox; uy=s.y+NODE_H+oy;
    }
    var kids=u.children.filter(function(i){return pos[i];});
    if(!kids.length) return;
    var kidTop=Math.min.apply(null,kids.map(function(i){return pos[i].y;}))+oy;
    var bus=kidTop-V_GAP/2;
    line(ux,uy,ux,bus);
    var cs=kids.map(function(i){return pos[i].x+NODE_W/2+ox;});
    line(Math.min.apply(null,cs.concat([ux])),bus,Math.max.apply(null,cs.concat([ux])),bus);
    kids.forEach(function(i){
      line(pos[i].x+NODE_W/2+ox,bus,pos[i].x+NODE_W/2+ox,pos[i].y+oy);
    });
  });
  svg.innerHTML=parts.join("");

  // nodes
  var q=query.trim().toLowerCase();
  data.people.forEach(function(p){
    var c=pos[p.id]; if(!c) return;
    var el=document.createElement("div");
    var sexCls=p.sex==="f"?" f":p.sex==="m"?" m":p.sex==="o"?" o":"";
    el.className="node"+sexCls+(selected===p.id?" sel":"")+
      (q&&label(p).toLowerCase().indexOf(q)>-1?" hit":"");
    el.style.left=(c.x+ox)+"px";
    el.style.top=(c.y+oy)+"px";
    var span=lifespan(p);
    el.innerHTML='<div class="n-name">'+esc(label(p))+'</div>'+
      (span?'<div class="n-rule"></div><div class="n-dates">'+esc(span)+'</div>':'');
    el.addEventListener("click",function(ev){ev.stopPropagation();select(p.id);});
    world.appendChild(el);
  });

  applyView();
}
function applyView(){
  world.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.k+")";
}

/* ============ record panel ============ */
function select(id){
  selected=id;
  render();
  openPanel();
}
function openPanel(){
  var p=byId[selected];
  if(!p){panel.classList.remove("open");return;}
  pTitle.textContent=label(p);
  panel.classList.add("open");
  drawPanel(p);
}
function closePanel(){panel.classList.remove("open");selected=null;render();}

function otherOptions(p,exclude){
  return data.people.filter(function(o){
    return o.id!==p.id && exclude.indexOf(o.id)===-1;
  }).sort(function(a,b){return label(a).localeCompare(label(b));});
}

function drawPanel(p){
  var kids=data.people.filter(function(c){return (c.parents||[]).indexOf(p.id)>-1;});
  var h=[];

  h.push('<div class="eyebrow">Details</div>');
  h.push('<div class="f"><label for="fName">Full name</label><input type="text" id="fName" value="'+esc(p.name)+'" placeholder="e.g. Ruth Ellen Carter"></div>');
  h.push('<div class="row2"><div class="f"><label for="fBirth">Born</label><input type="text" id="fBirth" value="'+esc(p.birth)+'" placeholder="1948"></div>'+
         '<div class="f"><label for="fDeath">Died</label><input type="text" id="fDeath" value="'+esc(p.death)+'" placeholder="blank if living"></div></div>');
  h.push('<div class="f"><label for="fSex">Shown as</label><select id="fSex">'+
    ['','f','m','o'].map(function(v){
      var t={"":"Not set","f":"Female","m":"Male","o":"Other"}[v];
      return '<option value="'+v+'"'+(p.sex===v?' selected':'')+'>'+t+'</option>';
    }).join("")+'</select><div class="hint">Sets the colour of the stripe on the card. Optional.</div></div>');
  h.push('<div class="f"><label for="fPlace">Place</label><input type="text" id="fPlace" value="'+esc(p.place)+'" placeholder="Charleston, SC"></div>');
  h.push('<div class="f"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Stories, occupations, anything worth keeping.">'+esc(p.notes)+'</textarea></div>');

  // parents
  h.push('<div class="eyebrow">Parents</div>');
  var pars=(p.parents||[]).filter(function(i){return byId[i];});
  if(pars.length){
    h.push('<div class="chips">'+pars.map(function(i){
      return '<div class="chip"><span data-go="'+i+'">'+esc(label(byId[i]))+'</span><button data-unpar="'+i+'" title="Unlink">&times;</button></div>';
    }).join("")+'</div>');
  }else h.push('<div class="none">None recorded.</div>');
  if(pars.length<2){
    h.push('<div class="acts"><button class="btn" data-act="newparent">New parent</button>');
    var opts=otherOptions(p,pars.concat(kids.map(function(k){return k.id;})));
    if(opts.length){
      h.push('<select id="linkParent" style="width:auto;flex:1;min-width:120px"><option value="">Link existing…</option>'+
        opts.map(function(o){return '<option value="'+o.id+'">'+esc(label(o))+'</option>';}).join("")+'</select>');
    }
    h.push('</div>');
  }

  // partners
  h.push('<div class="eyebrow">Partners</div>');
  var prt=(p.partners||[]).filter(function(i){return byId[i];});
  if(prt.length){
    h.push('<div class="chips">'+prt.map(function(i){
      return '<div class="chip"><span data-go="'+i+'">'+esc(label(byId[i]))+'</span><button data-unprt="'+i+'" title="Unlink">&times;</button></div>';
    }).join("")+'</div>');
  }else h.push('<div class="none">None recorded.</div>');
  h.push('<div class="acts"><button class="btn" data-act="newpartner">New partner</button>');
  var popts=otherOptions(p,prt.concat(pars));
  if(popts.length){
    h.push('<select id="linkPartner" style="width:auto;flex:1;min-width:120px"><option value="">Link existing…</option>'+
      popts.map(function(o){return '<option value="'+o.id+'">'+esc(label(o))+'</option>';}).join("")+'</select>');
  }
  h.push('</div>');

  // children
  h.push('<div class="eyebrow">Children</div>');
  if(kids.length){
    h.push('<div class="chips">'+kids.map(function(c){
      return '<div class="chip"><span data-go="'+c.id+'">'+esc(label(c))+'</span><button data-unkid="'+c.id+'" title="Unlink">&times;</button></div>';
    }).join("")+'</div>');
  }else h.push('<div class="none">None recorded.</div>');
  h.push('<div class="f"><label for="coParent">Other parent</label><select id="coParent"><option value="">Not recorded</option>'+
    prt.map(function(i){return '<option value="'+i+'">'+esc(label(byId[i]))+'</option>';}).join("")+
    '</select></div>');
  h.push('<div class="acts"><button class="btn" data-act="newchild">New child</button></div>');

  h.push('<div class="eyebrow">Remove</div>');
  h.push('<div class="acts"><button class="btn danger" data-act="delete">Delete this person</button></div>');
  h.push('<div class="hint">Their links to everyone else are removed too. This cannot be undone.</div>');

  pBody.innerHTML=h.join("");
  wirePanel(p);
}

function wirePanel(p){
  function bind(id,field){
    var el=document.getElementById(id);
    if(!el) return;
    el.addEventListener("input",function(){
      p[field]=el.value;
      pTitle.textContent=label(p);
      save();
      var node=null;
      Array.prototype.slice.call(world.querySelectorAll(".node.sel")).forEach(function(n){node=n;});
      if(node){
        var span=lifespan(p);
        node.innerHTML='<div class="n-name">'+esc(label(p))+'</div>'+
          (span?'<div class="n-rule"></div><div class="n-dates">'+esc(span)+'</div>':'');
      }
    });
    el.addEventListener("change",function(){commit();openPanel();});
  }
  bind("fName","name");bind("fBirth","birth");bind("fDeath","death");
  bind("fPlace","place");bind("fNotes","notes");
  var sx=document.getElementById("fSex");
  if(sx) sx.addEventListener("change",function(){p.sex=sx.value;commit();openPanel();});

  var lp=document.getElementById("linkParent");
  if(lp) lp.addEventListener("change",function(){
    if(!lp.value) return;
    if(p.parents.indexOf(lp.value)===-1&&p.parents.length<2) p.parents.push(lp.value);
    commit();openPanel();
  });
  var lq=document.getElementById("linkPartner");
  if(lq) lq.addEventListener("change",function(){
    if(!lq.value) return;
    var o=byId[lq.value];
    if(o&&p.partners.indexOf(o.id)===-1){p.partners.push(o.id);o.partners.push(p.id);}
    commit();openPanel();
  });
}

pBody.addEventListener("click",function(ev){
    var t=ev.target;
    var p=byId[selected];
    if(!p) return;
    if(t.dataset.go){select(t.dataset.go);return;}
    if(t.dataset.unpar){
      p.parents=p.parents.filter(function(i){return i!==t.dataset.unpar;});
      commit();openPanel();return;
    }
    if(t.dataset.unprt){
      var q=t.dataset.unprt;
      p.partners=p.partners.filter(function(i){return i!==q;});
      if(byId[q]) byId[q].partners=byId[q].partners.filter(function(i){return i!==p.id;});
      commit();openPanel();return;
    }
    if(t.dataset.unkid){
      var c=byId[t.dataset.unkid];
      if(c) c.parents=c.parents.filter(function(i){return i!==p.id;});
      commit();openPanel();return;
    }
    var act=t.dataset.act;
    if(!act) return;
    if(act==="newparent"){
      var np=blank();data.people.push(np);index();
      p.parents.push(np.id);commit();select(np.id);
    }else if(act==="newpartner"){
      var ps=blank();data.people.push(ps);index();
      p.partners.push(ps.id);ps.partners.push(p.id);commit();select(ps.id);
    }else if(act==="newchild"){
      var co=document.getElementById("coParent");
      var kid=blank();kid.parents=[p.id];
      if(co&&co.value) kid.parents.push(co.value);
      data.people.push(kid);commit();select(kid.id);
    }else if(act==="delete"){
      if(!confirm("Delete "+label(p)+"? Their links to everyone else are removed too.")) return;
      var id=p.id;
      data.people=data.people.filter(function(o){return o.id!==id;});
      data.people.forEach(function(o){
        o.parents=o.parents.filter(function(i){return i!==id;});
        o.partners=o.partners.filter(function(i){return i!==id;});
      });
      selected=null;panel.classList.remove("open");commit();
      toast("Person deleted");
    }
});

function blank(){
  return {id:uid(),name:"",sex:"",birth:"",death:"",place:"",notes:"",parents:[],partners:[]};
}

/* ============ pan & zoom ============ */
var dragging=false,sx0=0,sy0=0,vx0=0,vy0=0,moved=false;
stage.addEventListener("mousedown",function(e){
  if(e.target.closest(".node")) return;
  dragging=true;moved=false;sx0=e.clientX;sy0=e.clientY;vx0=view.x;vy0=view.y;
  stage.classList.add("drag");
});
window.addEventListener("mousemove",function(e){
  if(!dragging) return;
  view.x=vx0+(e.clientX-sx0);view.y=vy0+(e.clientY-sy0);
  if(Math.abs(e.clientX-sx0)+Math.abs(e.clientY-sy0)>4) moved=true;
  applyView();
});
window.addEventListener("mouseup",function(){
  if(dragging&&!moved&&selected){closePanel();}
  dragging=false;stage.classList.remove("drag");
});
stage.addEventListener("wheel",function(e){
  e.preventDefault();
  var r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  var f=e.deltaY<0?1.11:1/1.11, nk=Math.min(2.2,Math.max(.22,view.k*f));
  view.x=mx-(mx-view.x)*(nk/view.k);
  view.y=my-(my-view.y)*(nk/view.k);
  view.k=nk;applyView();
},{passive:false});

// touch
var tp={};
stage.addEventListener("touchstart",function(e){
  if(e.touches.length===1&&!e.target.closest(".node")){
    tp.mode="pan";tp.x=e.touches[0].clientX;tp.y=e.touches[0].clientY;tp.vx=view.x;tp.vy=view.y;
  }else if(e.touches.length===2){
    tp.mode="pinch";
    tp.d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    tp.k=view.k;
  }
},{passive:true});
stage.addEventListener("touchmove",function(e){
  if(tp.mode==="pan"&&e.touches.length===1){
    view.x=tp.vx+(e.touches[0].clientX-tp.x);
    view.y=tp.vy+(e.touches[0].clientY-tp.y);applyView();e.preventDefault();
  }else if(tp.mode==="pinch"&&e.touches.length===2){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    view.k=Math.min(2.2,Math.max(.22,tp.k*(d/tp.d)));applyView();e.preventDefault();
  }
},{passive:false});
stage.addEventListener("touchend",function(){tp.mode=null;});

function fit(){
  var w=world.offsetWidth,h=world.offsetHeight;
  if(!w||!h) return;
  var k=Math.min(stage.clientWidth/w,stage.clientHeight/h,1.15);
  view.k=Math.max(.22,k);
  view.x=(stage.clientWidth-w*view.k)/2;
  view.y=(stage.clientHeight-h*view.k)/2;
  applyView();
}
function zoom(f){
  var cx=stage.clientWidth/2,cy=stage.clientHeight/2;
  var nk=Math.min(2.2,Math.max(.22,view.k*f));
  view.x=cx-(cx-view.x)*(nk/view.k);
  view.y=cy-(cy-view.y)*(nk/view.k);
  view.k=nk;applyView();
}

/* ============ toolbar ============ */
document.getElementById("zin").onclick=function(){zoom(1.18);};
document.getElementById("zout").onclick=function(){zoom(1/1.18);};
document.getElementById("zfit").onclick=fit;
document.getElementById("pClose").onclick=closePanel;
document.getElementById("printBtn").onclick=function(){window.print();};

function addPerson(){
  var p=blank();data.people.push(p);commit();select(p.id);
  setTimeout(function(){var f=document.getElementById("fName");if(f)f.focus();},60);
}
document.getElementById("addBtn").onclick=addPerson;
document.getElementById("startBtn").onclick=function(){addPerson();setTimeout(fit,80);};

var nameIn=document.getElementById("treename");
nameIn.addEventListener("input",function(){data.name=nameIn.value;save();});

document.getElementById("search").addEventListener("input",function(){
  query=this.value;render();
});

document.getElementById("saveBtn").onclick=function(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(data.name||"family-tree").replace(/[^\w\-]+/g,"-").toLowerCase()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast("File downloaded");
};
document.getElementById("openBtn").onclick=function(){document.getElementById("fileIn").click();};
document.getElementById("fileIn").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.people)) throw 0;
      data=normalize(d);
      nameIn.value=data.name;
      selected=null;panel.classList.remove("open");
      commit();setTimeout(fit,60);
      toast("Tree opened");
    }catch(err){
      toast("That file isn't a saved tree");
    }
  };
  r.readAsText(f);
  e.target.value="";
});

window.addEventListener("keydown",function(e){
  if(e.key==="Escape") closePanel();
});
window.addEventListener("beforeunload",save);

/* ============ boot ============ */
load();
index();
nameIn.value=data.name;
render();
setTimeout(fit,40);

})();
</script>
</body>
